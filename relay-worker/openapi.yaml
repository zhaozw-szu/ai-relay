openapi: 3.1.0
info:
  title: AI Relay Control Center
  version: 1.1.0
  description: Legacy encrypted relay plus the first persistent control-center APIs.
servers:
  - url: https://ai-relay-writer.zhaozw-ai-relay.workers.dev
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Worker is available
  /read:
    get:
      operationId: readRelayMessages
      security:
        - RelayPassword: []
      parameters:
        - name: agent_id
          in: query
          required: true
          schema:
            type: string
          example: cloud-chatgpt-01
        - name: conversation_id
          in: query
          required: false
          schema:
            type: string
          example: utf8-test
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 10
      responses:
        '200':
          description: Decrypted messages for the agent
        '401':
          description: Shared password is invalid
  /write:
    post:
      operationId: writeRelayMessage
      security:
        - RelayPassword: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id, to, content]
              properties:
                agent_id:
                  type: string
                  example: cloud-chatgpt-01
                to:
                  type: array
                  items:
                    type: string
                  example: [codex-local-01]
                conversation_id:
                  type: string
                type:
                  type: string
                  enum: [task, result, question, ack, cancel]
                  default: task
                content:
                  type: string
                reply_to:
                  type: string
                task_id:
                  type: string
      responses:
        '200':
          description: Message was encrypted and committed
        '401':
          description: Shared password is invalid
        '403':
          description: Agent is not registered
  /api/agents:
    get:
      operationId: listAgents
      security:
        - ManagementPassword: []
      responses:
        '200':
          description: Registered agents and real heartbeat status
    post:
      operationId: registerAgent
      security:
        - ManagementPassword: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agent_id]
              properties:
                agent_id: { type: string }
                name: { type: string }
                type: { type: string }
                role: { type: string }
                capabilities: { type: array, items: { type: string } }
      responses:
        '201': { description: Agent registered }
  /api/conversations:
    get:
      operationId: listConversations
      security:
        - ManagementPassword: []
      responses:
        '200': { description: Persisted conversations }
    post:
      operationId: createConversation
      security:
        - ManagementPassword: []
      responses:
        '201': { description: Conversation created }
  /api/conversations/{conversation_id}:
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getConversation
      security:
        - ManagementPassword: []
      responses:
        '200': { description: Conversation state }
    patch:
      operationId: updateConversation
      security:
        - ManagementPassword: []
      responses:
        '200': { description: Conversation updated or archived }
  /api/conversations/{conversation_id}/{action}:
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema: { type: string }
      - name: action
        in: path
        required: true
        schema:
          type: string
          enum: [start, pause, resume, stop, events, messages]
    post:
      operationId: conversationAction
      security:
        - ManagementPassword: []
      responses:
        '200': { description: State transition accepted }
    get:
      operationId: conversationSubresource
      security:
        - ManagementPassword: []
      responses:
        '200': { description: Events or message index }
  /api/conversations/{conversation_id}/tasks:
    parameters:
      - name: conversation_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listConversationTasks
      security:
        - ManagementPassword: []
      responses:
        '200': { description: Task timeline }
    post:
      operationId: createConversationTask
      security:
        - ManagementPassword: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_agent_id, instruction]
              properties:
                target_agent_id: { type: string }
                instruction: { type: string }
                task_type: { type: string, enum: [read_only_analysis, code_change, command] }
                sandbox_mode: { type: string, enum: [read-only, workspace-write] }
                working_directory_id: { type: string }
                idempotency_key: { type: string }
      responses:
        '201': { description: Task created }
  /api/tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: getTask
      security:
        - ManagementPassword: []
      responses:
        '200': { description: Task state }
  /api/message-outbox:
    get:
      operationId: listMessageOutbox
      security:
        - ManagementPassword: []
      responses:
        '200': { description: Durable task-result message delivery records }
  /api/message-outbox/{outbox_id}/retry:
    parameters:
      - name: outbox_id
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: retryMessageOutbox
      security:
        - ManagementPassword: []
      responses:
        '200': { description: Message delivered and indexed }
        '202': { description: Delivery remains pending }
  /api/agent/heartbeat:
    post:
      operationId: agentHeartbeat
      security:
        - AgentKey: []
      responses:
        '200': { description: Heartbeat accepted }
  /api/agent/claim:
    post:
      operationId: claimTask
      security:
        - AgentKey: []
      responses:
        '200': { description: At most one task lease }
  /api/agent/tasks/{task_id}/{agent_action}:
    parameters:
      - name: task_id
        in: path
        required: true
        schema: { type: string }
      - name: agent_action
        in: path
        required: true
        schema:
          type: string
          enum: [ack, renew, result]
    post:
      operationId: agentTaskAction
      security:
        - AgentKey: []
      responses:
        '200': { description: Task lease action accepted }
components:
  securitySchemes:
    RelayPassword:
      type: apiKey
      in: header
      name: X-Relay-Password
    ManagementPassword:
      type: apiKey
      in: header
      name: X-Relay-Admin
    AgentKey:
      type: apiKey
      in: header
      name: X-Agent-Key
